version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova_telecom_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nova_telecom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nova_telecom_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_telecom_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nova_telecom?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "production-ultra-secure-nova-telecom-jwt-secret-key-2026"
      JWT_REFRESH_SECRET: "production-ultra-secure-nova-telecom-refresh-secret-2026"
      WEBHOOK_SECRET: "whsec_live_nova_telecom_prod_sig"

volumes:
  pgdata:
  redisdata:
